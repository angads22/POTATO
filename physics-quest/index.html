<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Physics Quest 12</title>
<meta name="description" content="A role-playing adventure for Grade 12 Physics (Ontario SPH4U): defeat monsters by solving dynamics, energy, fields, light and modern physics problems.">
<style>
:root {
  --ink: #1d1840; --muted: #6b6790; --paper: #fffdf7; --line: #e6e1f5;
  --accent: #ffb627; --good: #23a866; --bad: #e0435a; --sky: #14122b;
  --dyn: #f08a24; --enm: #2bb673; --fld: #8c52ff; --wav: #1aa7ec; --mod: #e8458b;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
  font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
canvas#game { position: fixed; inset: 0; display: block; touch-action: none; }
.hidden { display: none !important; }
button { font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 14px;
  background: var(--accent); color: var(--ink); box-shadow: 0 3px 0 rgba(0,0,0,.28); transition: transform .06s, filter .1s; }
button:hover:not(:disabled) { filter: brightness(1.06); }
button:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.28); }
button:disabled { opacity: .45; cursor: default; }
button.ghost { background: #efeaff; }
button.good { background: var(--good); color: #fff; }
button.bad { background: var(--bad); color: #fff; }
button.small { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
input, textarea, select { font: inherit; border: 2px solid var(--line); border-radius: 10px; padding: 9px 11px; background: #fff; color: var(--ink); }
input:focus, textarea:focus { outline: none; border-color: var(--accent); }
h1, h2, h3 { margin: 0 0 8px; line-height: 1.15; }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }

/* HUD */
#hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none; z-index: 5; }
.card { background: rgba(255,253,247,.95); border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 16px rgba(0,0,0,.28); pointer-events: auto; }
#hudStats { min-width: 190px; font-size: 14px; }
#hudStats .name { font-weight: 800; font-size: 15px; }
.bar { position: relative; height: 12px; background: #e3def2; border-radius: 7px; overflow: hidden; margin: 3px 0; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--good); border-radius: 7px; transition: width .35s; }
.bar.xp > i { background: #6a5cff; }
.bar.enemy > i { background: var(--bad); }
.bar > span { position: absolute; inset: 0; font-size: 10px; line-height: 12px; text-align: center; font-weight: 800; color: #1d1840; }
#hudButtons { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; pointer-events: auto; }
#hudButtons button { padding: 8px 10px; font-size: 13px; }
#zoneLabel { position: fixed; top: 74px; left: 50%; transform: translateX(-50%); color: #fff; font-weight: 800; font-size: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.6); pointer-events: none; opacity: 0; transition: opacity .6s; z-index: 4; text-align: center; white-space: nowrap; }
#zoneLabel small { display: block; font-size: 13px; font-weight: 700; opacity: .9; }
#prompt { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); z-index: 6; font-size: 15px; max-width: calc(100vw - 24px); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 12px; background: rgba(12,10,30,.55); }
.sheet { background: var(--paper); border-radius: 18px; box-shadow: 0 12px 40px rgba(0,0,0,.45); width: min(760px, 100%); max-height: calc(100vh - 24px); overflow: auto; padding: 18px; position: relative; }
.sheet .close { position: absolute; top: 10px; right: 10px; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 12px; }
.tabs button { background: #efeaff; padding: 7px 12px; font-size: 14px; }
.tabs button.on { background: var(--ink); color: #fff; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.tile { border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fff; }
.tile h4 { margin: 0 0 4px; }
.chip { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 800; color: #fff; }
.stars { color: #f4b400; letter-spacing: 1px; white-space: nowrap; }
.stars .off { color: #d6d0e8; }
.skill-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
.skill-row:last-child { border-bottom: 0; }
.skill-row .nm { flex: 1; min-width: 0; }
.skill-row .meta { font-size: 12px; color: var(--muted); }
ul.formulas { margin: 4px 0 12px; padding-left: 20px; line-height: 1.6; }
table.consts { border-collapse: collapse; width: 100%; font-size: 14px; }
table.consts td { padding: 4px 6px; border-bottom: 1px solid var(--line); }
.journal-item { border-left: 4px solid var(--bad); padding: 6px 10px; margin: 8px 0; background: #fff; border-radius: 0 10px 10px 0; }

/* Title */
#title { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: auto;
  background: radial-gradient(circle at 30% 20%, #3b2f8f 0%, #1a1640 55%, #0d0b22 100%); }
#title .box { width: min(560px, 100%); text-align: center; color: #fff; }
#title h1 { font-size: clamp(36px, 9vw, 64px); letter-spacing: 1px; margin: 0; text-shadow: 0 4px 0 #6a5cff, 0 8px 24px rgba(0,0,0,.5); }
#title .sub { font-size: 16px; opacity: .9; margin: 6px 0 20px; }
#title .panel { background: rgba(255,253,247,.97); color: var(--ink); border-radius: 18px; padding: 16px; text-align: left; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 10px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--line); padding: 0; }
.swatch.on { box-shadow: 0 0 0 3px var(--ink); }
#lookPreview { display: block; margin: 0 auto; }

/* Battle */
#battleUI { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
#battleUI .bars { position: absolute; top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; display: flex; justify-content: space-between; gap: 10px; }
#battleUI .bars .card { width: min(300px, 47vw); font-size: 14px; }
#battleUI .bars .card b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bMsg { position: absolute; left: 50%; transform: translateX(-50%); top: 92px; color: #fff; font-weight: 800; font-size: 18px; text-shadow: 0 2px 6px rgba(0,0,0,.7); text-align: center; width: 92vw; }
#bMenu { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 12px max(12px, env(safe-area-inset-bottom)); background: linear-gradient(transparent, rgba(10,8,28,.85) 30%); pointer-events: auto; }
#bMenu .inner { max-width: 820px; margin: 0 auto; }
#bMenu .spells { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.spell-btn { text-align: left; color: #fff; padding: 9px 12px; line-height: 1.2; position: relative; }
.spell-btn small { display: block; font-weight: 600; opacity: .9; font-size: 12px; }
.spell-btn .eff { position: absolute; top: -8px; right: 8px; background: #fff; color: var(--bad); font-size: 11px; padding: 1px 6px; border-radius: 8px; }
#bMenu .actions { display: flex; gap: 8px; margin-top: 8px; justify-content: center; flex-wrap: wrap; }
#bResult { pointer-events: auto; }

/* Question */
#qModal { z-index: 25; align-items: flex-end; }
@media (min-height: 560px) { #qModal { align-items: center; } }
.qsheet { background: var(--paper); border-radius: 18px; width: min(780px, 100%); max-height: calc(100vh - 24px); overflow: auto; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.qprompt { font-size: 18px; line-height: 1.45; margin: 6px 0 12px; }
.qchoices { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 560px) { .qchoices { grid-template-columns: 1fr; } .qprompt { font-size: 16px; } }
.choice { background: #fff; border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); text-align: left; font-weight: 600; padding: 10px 12px; }
.choice b { display: inline-block; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 7px; background: #efeaff; margin-right: 8px; font-size: 13px; }
.choice:disabled { opacity: 1; color: var(--muted); }
.choice.right { background: #dff7ea; border-color: var(--good); color: var(--ink); }
.choice.wrong { background: #fde3e7; border-color: var(--bad); color: var(--ink); }
.qtyped { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.qtyped input { flex: 1; min-width: 160px; font-size: 17px; }
.qtyped .unit { font-weight: 800; }
.qtools { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.qtools button { background: #efeaff; font-size: 13px; padding: 7px 10px; }
.qbox { margin-top: 10px; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 10px; }
.calc-keys { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.calc-keys button { background: #f5f2ff; padding: 5px 9px; font-size: 13px; box-shadow: 0 2px 0 var(--line); }
#calcOut { font-weight: 800; margin-top: 6px; min-height: 22px; }
.feedback { margin-top: 12px; border-radius: 14px; padding: 12px; }
.feedback.ok { background: #e3f8ec; border: 2px solid var(--good); }
.feedback.no { background: #fff0f2; border: 2px solid var(--bad); }
.feedback h3 { margin: 0 0 6px; }
.feedback ol { margin: 6px 0; padding-left: 22px; line-height: 1.6; }

#toasts { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: 92vw; }
.toast { background: rgba(29,24,64,.94); color: #fff; padding: 8px 14px; border-radius: 12px; font-weight: 700; box-shadow: 0 6px 20px rgba(0,0,0,.35); animation: toastIn .25s ease-out; text-align: center; max-width: 520px; }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (max-width: 520px) {
  #hudStats { min-width: 0; font-size: 12px; padding: 6px 9px; }
  #hudButtons button { padding: 7px 8px; font-size: 12px; }
  #zoneLabel { top: 110px; font-size: 18px; }
  #bMsg { top: 104px; font-size: 15px; }
  #bMenu .spells { grid-template-columns: 1fr 1fr; }
  .spell-btn { font-size: 13px; padding: 8px 9px; }
}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="hudStats" class="card"></div>
  <div id="hudButtons">
    <button id="btnCodex" title="Codex: mastery, formulas, practice (C)">📖 Codex</button>
    <button id="btnBag" title="Bag (B)">🎒 Bag</button>
    <button id="btnHome" title="Return to the Academy (H)">🏠 Home</button>
    <button id="btnSettings" title="Settings">⚙️</button>
  </div>
</div>
<div id="zoneLabel"></div>
<button id="prompt" class="hidden"></button>

<div id="battleUI" class="hidden">
  <div class="bars">
    <div class="card" id="bPlayer"></div>
    <div class="card" id="bEnemy"></div>
  </div>
  <div id="bMsg"></div>
  <div id="bMenu"><div class="inner" id="bMenuInner"></div></div>
</div>

<div id="modal" class="overlay hidden"><div class="sheet" id="sheet"></div></div>
<div id="qModal" class="overlay hidden"><div class="qsheet" id="qSheet"></div></div>

<div id="title">
  <div class="box">
    <h1>PHYSICS QUEST</h1>
    <div class="sub">A Grade 12 Physics adventure · Ontario SPH4U</div>
    <div class="panel" id="titlePanel"></div>
  </div>
</div>
<div id="toasts"></div>

<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
